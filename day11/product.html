<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 카드</title>
    <style></style>
    <link rel="stylesheet" href="product.css" />
    <script src="product.js" defer></script>
  </head>
  <body>
    <article class="card">
      <img id="thumb" alt="" />
      <div class="body">
        <p class="cat" id="cat"></p>
        <h2 id="title"></h2>
        <p class="brand" id="brand"></p>
        <div>
          <span class="stars" id="stars"></span
          ><span class="rating" id="rating"></span>
        </div>
        <div class="price">
          <span id="price"></span><span class="orig" id="orig"></span>
        </div>
        <span class="stock" id="stock"></span>
      </div>
    </article>

    <p id="status"></p>
    <button id="next">다음 상품 →</button>
  </body>
</html>
