<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘 할 일</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <p class="head__date" id="today"></p>
        <h1 class="head__title">오늘 할 일</h1>
        <p class="head__progress" id="progress-text"></p>
        <div class="bar" aria-hidden="true">
          <span class="bar__fill" id="progress-bar"></span>
        </div>
      </header>

      <form class="add" id="form">
        <input
          class="add__input"
          id="txt"
          placeholder="할 일을 적고 Enter"
          aria-label="할 일"
          autocomplete="off"
          maxlength="80"
        />
        <button class="add__btn" id="add" disabled>추가</button>
      </form>

      <div class="filters" id="filters" role="group" aria-label="목록 보기">
        <button type="button" data-filter="all" aria-pressed="true">
          전체
        </button>
        <button type="button" data-filter="active" aria-pressed="false">
          남은 일
        </button>
        <button type="button" data-filter="done" aria-pressed="false">
          끝낸 일
        </button>
      </div>

      <ul class="list" id="list"></ul>

      <footer class="foot">
        <button class="foot__clear" id="clear" type="button" disabled>
          끝낸 일 지우기
        </button>
      </footer>
    </main>

    <script type="module" src="app.js" defer></script>
  </body>
</html>
